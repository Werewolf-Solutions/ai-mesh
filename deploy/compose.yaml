# One Werewolf AI Mesh full node.
#
#   cp .env.example .env            # then edit (MESH_UID/MESH_GID!)
#   ./mesh model download           # optional: pre-fetch the default model into ./models
#   ./mesh init --docker --data ./data/node --network <id> --label <name> [--announce ...] [--bootstrap ...]
#   docker compose --env-file .env -f deploy/compose.yaml up -d
#
# The container runs the node and, for each hosted model, a llama.cpp process
# bound to 127.0.0.1 INSIDE the container (never published). Operators can
# install more catalog models from the UI; files go to MESH_MODELS_DIR and are
# SHA-256 verified before every load.
name: werewolf-mesh

services:
  node:
    image: ${MESH_IMAGE:-werewolf-mesh/node:0.2.0}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    user: "${MESH_UID:-1000}:${MESH_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=64m"]
    command: ["start", "--data", "/data"]
    environment:
      MESH_DATA_DIR: /data
      MESH_LOG_LEVEL: ${MESH_LOG_LEVEL:-info}
      MESH_THREADS: ${MESH_THREADS:-2}
    volumes:
      - "${MESH_DATA_DIR:-../data/node}:/data"
      # Read-write so the node's operator can install catalog models from the UI.
      - "${MESH_MODELS_DIR:-../models}:/models"
    ports:
      # HTTP API + UI. Loopback only by default; put an HTTPS reverse proxy in front for remote use.
      - "${MESH_HTTP_BIND:-127.0.0.1}:${MESH_HTTP_PORT:-8080}:8080"
      # Peer transport (libp2p over TCP). Loopback by default. Public/relay nodes set MESH_P2P_BIND=0.0.0.0.
      # NOTE: Docker-published ports bypass ufw rules on many systems; see docs/operations.md.
      - "${MESH_P2P_BIND:-127.0.0.1}:${MESH_P2P_PORT:-4001}:4001"
    restart: unless-stopped
    stop_grace_period: 25s
    # Budget for the node AND the models it hosts (see the catalog's RAM figures).
    cpus: ${MESH_CPUS:-2}
    mem_limit: ${MESH_MEM:-3g}
