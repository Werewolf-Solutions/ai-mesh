# One Werewolf AI Mesh full node: node service + separate pinned llama.cpp runtime.
#
#   cp .env.example .env            # then edit
#   ./mesh model download           # once, into ./models (or ./mesh model import <file>)
#   ./mesh init --docker --data ./data/node --network <id> --label <name> [--announce ...] [--bootstrap ...]
#   docker compose --env-file .env -f deploy/compose.yaml up -d
#
# The runtime is on an internal network with NO published port and no internet access.
name: werewolf-mesh

x-hardening: &hardening
  user: "${MESH_UID:-1000}:${MESH_GID:-1000}"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=16m"]

services:
  model-verify:
    <<: *hardening
    image: ${MESH_IMAGE:-werewolf-mesh/node:0.1.0}
    command: ["model", "verify", "--dir", "/models"]
    network_mode: none
    restart: "no"
    volumes: ["${MESH_MODELS_DIR:-../models}:/models:ro"]

  runtime:
    <<: *hardening
    image: ghcr.io/ggml-org/llama.cpp:server-b11223@sha256:8fdfad183be053cdb72d4b6a5930c3a2475730f932855ee9260193422c2564ed
    command:
      - "-m"
      - "/models/SmolLM2-135M-Instruct-Q4_K_M.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "2048"
      - "-np"
      - "1"
      - "-t"
      - "${MESH_THREADS:-2}"
      - "-tb"
      - "${MESH_THREADS:-2}"
      - "-n"
      - "256"
      - "--api-key-file"
      - "/keys/runtime.key"
      - "--no-webui"
      - "--offline"
      - "--no-slots"
    volumes:
      - "${MESH_MODELS_DIR:-../models}:/models:ro"
      - "${MESH_DATA_DIR:-../data/node}/runtime.key:/keys/runtime.key:ro"
    networks: [runtime]
    restart: unless-stopped
    cpus: ${MESH_RUNTIME_CPUS:-2}
    mem_limit: ${MESH_RUNTIME_MEM:-1g}
    depends_on:
      model-verify: { condition: service_completed_successfully }

  node:
    <<: *hardening
    image: ${MESH_IMAGE:-werewolf-mesh/node:0.1.0}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["start", "--data", "/data"]
    environment:
      MESH_DATA_DIR: /data
      MESH_LOG_LEVEL: ${MESH_LOG_LEVEL:-info}
    volumes:
      - "${MESH_DATA_DIR:-../data/node}:/data"
      - "${MESH_MODELS_DIR:-../models}:/models:ro"
    networks: [mesh, runtime]
    ports:
      # HTTP API + UI. Loopback only by default; put an HTTPS reverse proxy in front for remote use.
      - "${MESH_HTTP_BIND:-127.0.0.1}:${MESH_HTTP_PORT:-8080}:8080"
      # Peer transport (libp2p over TCP). Loopback by default. Public/relay nodes set MESH_P2P_BIND=0.0.0.0.
      # NOTE: Docker-published ports bypass ufw rules on many systems; see docs/operations.md.
      - "${MESH_P2P_BIND:-127.0.0.1}:${MESH_P2P_PORT:-4001}:4001"
    restart: unless-stopped
    stop_grace_period: 25s
    cpus: ${MESH_NODE_CPUS:-1}
    mem_limit: ${MESH_NODE_MEM:-512m}
    depends_on:
      runtime: { condition: service_started }

networks:
  mesh: {}
  runtime: { internal: true }
